[workspace]
resolver = "2"
members = [
    "crates/riffty_core",
    "crates/riffty_infra_core",
    "crates/riffty_ab_core",
    "crates/riffty_pipeline",
    "crates/riffty_rules_builtin",
    "crates/adapters/riffty_adapter_ruff_ast",
    "crates/adapters/riffty_adapter_fs",
    "crates/adapters/riffty_adapter_ast_grep",
    "crates/adapters/riffty_adapter_ty",
    "crates/adapters/riffty_adapter_refaster",
    "crates/adapters/riffty_adapter_java_fast",
    "crates/adapters/riffty_adapter_jsts_fast",
    "crates/adapters/riffty_adapter_tsrs",
    "crates/adapters/riffty_adapter_plugin",
    "crates/adapters/riffty_adapter_infra",
    "apps/riffty_mcp",
    "apps/riffty_cli",
    "apps/riffty_ab",
    "tests/conformance",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/riffty-sh/riffty"

[workspace.dependencies]
riffty_core = { version = "0.2.0", path = "crates/riffty_core" }
riffty_infra_core = { version = "0.2.0", path = "crates/riffty_infra_core" }
riffty_ab_core = { version = "0.2.0", path = "crates/riffty_ab_core" }
riffty_pipeline = { version = "0.2.0", path = "crates/riffty_pipeline" }
riffty_rules_builtin = { version = "0.2.0", path = "crates/riffty_rules_builtin" }
riffty_adapter_ruff_ast = { version = "0.2.0", path = "crates/adapters/riffty_adapter_ruff_ast" }
riffty_adapter_fs = { version = "0.2.0", path = "crates/adapters/riffty_adapter_fs" }
riffty_adapter_ast_grep = { version = "0.2.0", path = "crates/adapters/riffty_adapter_ast_grep" }
riffty_adapter_ty = { version = "0.2.0", path = "crates/adapters/riffty_adapter_ty" }
riffty_adapter_refaster = { version = "0.2.0", path = "crates/adapters/riffty_adapter_refaster" }
riffty_adapter_java_fast = { version = "0.2.0", path = "crates/adapters/riffty_adapter_java_fast" }
riffty_adapter_jsts_fast = { version = "0.2.0", path = "crates/adapters/riffty_adapter_jsts_fast" }
riffty_adapter_tsrs = { version = "0.2.0", path = "crates/adapters/riffty_adapter_tsrs" }
riffty_adapter_plugin = { version = "0.2.0", path = "crates/adapters/riffty_adapter_plugin" }
riffty_adapter_infra = { version = "0.2.0", path = "crates/adapters/riffty_adapter_infra" }
riffty_mcp = { version = "0.2.0", path = "apps/riffty_mcp" }
clap = { version = "4.6", features = ["derive", "env"] }
rmcp = { version = "3.10.0", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "1.44", features = ["rt-multi-thread", "macros", "io-std", "sync"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
serde_yaml_ng = "0.10.0"
toml = "1.2"
ignore = "0.4"
ruff_python_parser = "0.0.22"
ruff_python_ast = "0.0.22"
ruff_python_codegen = "0.0.22"
ruff_text_size = "0.0.22"
ruff_db = { version = "0.0.22", default-features = false }
ty_module_resolver = "0.0.22"
ty_python_core = { version = "0.0.22", features = ["testing"] }
ty_python_semantic = "0.0.22"
ty_site_packages = "0.0.22"
ty_vendored = "0.0.22"
salsa = { version = "0.28.5", default-features = false, features = ["compact_str", "macros", "salsa_unstable", "inventory", "ordermap"] }
ast-grep-core = "0.51.2"
ast-grep-language = { version = "0.51.2", default-features = false, features = ["tree-sitter-python", "tree-sitter-java", "tree-sitter-typescript", "tree-sitter-javascript"] }
oxc_allocator = "0.159.0"
oxc_ast = "0.159.0"
oxc_ast_visit = "0.159.0"
oxc_parser = "0.159.0"
oxc_semantic = "0.159.0"
oxc_span = "0.159.0"
tsrs_ast = "=7.1.0-beta.tsrs3"
tsrs_binder = "=7.1.0-beta.tsrs3"
tsrs_checker = "=7.1.0-beta.tsrs3"
tsrs_compiler = "=7.1.0-beta.tsrs3"
tsrs_core = "=7.1.0-beta.tsrs3"
tsrs_scanner = "=7.1.0-beta.tsrs3"
tsrs_tsoptions = "=7.1.0-beta.tsrs3"
tsrs_vfs = "=7.1.0-beta.tsrs3"
