name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Run Unified Verification Pipeline (Build/CI Parity)
        run: bash scripts/verify-all.sh

  docker-smoke:
    name: Docker Pre-Hydrated Clean-Room Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build pre-hydrated riffty Docker image
        run: docker build -t riffty:ci-smoke .
      - name: Verify Python, JS/TS, and Java Tier 2 inside container (zero host setup)
        run: |
          mkdir -p /tmp/riffty-docker-smoke
          printf 'async def f(): pass\ndef g(): f()\n' > /tmp/riffty-docker-smoke/app.py
          printf 'export const x = [3, 1, 2].sort();\n' > /tmp/riffty-docker-smoke/app.ts
          printf '{"compilerOptions":{"strict":true}}\n' > /tmp/riffty-docker-smoke/tsconfig.json
          printf 'import java.math.BigDecimal;\nclass App { BigDecimal x = new BigDecimal(0.1); }\n' > /tmp/riffty-docker-smoke/App.java
          docker run --rm -v /tmp/riffty-docker-smoke:/repo riffty:ci-smoke --version
          docker run --rm --entrypoint riffty-ab riffty:ci-smoke --version
          docker run --rm -v /tmp/riffty-docker-smoke:/repo riffty:ci-smoke plugin status
          rc=0
          docker run --rm -v /tmp/riffty-docker-smoke:/repo riffty:ci-smoke check --require-tier2 --fix --dry-run --summary . || rc=$?
          if [ "$rc" -ge 2 ]; then
            echo "ERROR: Docker smoke test failed with fatal exit code $rc" >&2
            exit "$rc"
          fi
