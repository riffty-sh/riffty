name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build & publish (e.g. v0.4.0)"
        required: false
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-java-sidecar-jar:
    name: Build Java Tier 2 Sidecar JAR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Build & test shaded riffty-java-runner.jar and SHA-256 manifest
        run: bash plugins/riffty-java/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: java-sidecar-jar
          path: |
            plugins/riffty-java/dist/riffty-java-runner.jar
            plugins/riffty-java/dist/riffty-java.sha256

  build-binaries:
    name: Build Core + On-Demand Java Sidecar (${{ matrix.target }})
    needs: build-java-sidecar-jar
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            ext: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            ext: tar.gz
          - target: aarch64-apple-darwin
            os: macos-14
            ext: tar.gz
          - target: x86_64-apple-darwin
            os: macos-15-intel
            ext: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: zip
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/download-artifact@v4
        with:
          name: java-sidecar-jar
          path: plugins/riffty-java/dist
      - name: Package self-contained jlink JDK 25 runtime + Leyden AOT cache
        shell: bash
        env:
          SKIP_JAR_BUILD: "1"
        run: bash plugins/riffty-java/package_jlink_aot.sh
      - name: Build lean core release binaries
        run: cargo build --release --locked --target ${{ matrix.target }} --bin riffty --bin riffty_mcp --bin riffty-ab
      - name: Package Unix lean core + on-demand Java sidecar archives
        if: matrix.ext == 'tar.gz'
        shell: bash
        run: |
          mkdir -p dist core-staging java-staging
          cp "target/${{ matrix.target }}/release/riffty" core-staging/
          cp "target/${{ matrix.target }}/release/riffty_mcp" core-staging/
          cp "target/${{ matrix.target }}/release/riffty-ab" core-staging/
          cp LICENSE README.md core-staging/
          tar -C core-staging -czf "dist/riffty-${{ matrix.target }}.tar.gz" .

          cp -R plugins/riffty-java/dist/. java-staging/
          tar -C java-staging -czf "dist/riffty-java-${{ matrix.target }}.tar.gz" .

          hash_file() {
            if command -v sha256sum >/dev/null 2>&1; then
              (cd dist && sha256sum "$1" > "$1.sha256")
            else
              (cd dist && shasum -a 256 "$1" > "$1.sha256")
            fi
          }
          hash_file "riffty-${{ matrix.target }}.tar.gz"
          hash_file "riffty-java-${{ matrix.target }}.tar.gz"
      - name: Package Windows lean core + on-demand Java sidecar archives
        if: matrix.ext == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist, core-staging, java-staging | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/riffty.exe" core-staging/
          Copy-Item "target/${{ matrix.target }}/release/riffty_mcp.exe" core-staging/
          Copy-Item "target/${{ matrix.target }}/release/riffty-ab.exe" core-staging/
          Copy-Item LICENSE, README.md core-staging/
          Compress-Archive -Path core-staging/* -DestinationPath "dist/riffty-${{ matrix.target }}.zip"
          $coreHash = (Get-FileHash "dist/riffty-${{ matrix.target }}.zip" -Algorithm SHA256).Hash.ToLower()
          "$coreHash  riffty-${{ matrix.target }}.zip" | Out-File -Encoding ascii "dist/riffty-${{ matrix.target }}.zip.sha256"

          Copy-Item -Recurse -Force "plugins/riffty-java/dist/*" java-staging/
          Compress-Archive -Path java-staging/* -DestinationPath "dist/riffty-java-${{ matrix.target }}.zip"
          $javaHash = (Get-FileHash "dist/riffty-java-${{ matrix.target }}.zip" -Algorithm SHA256).Hash.ToLower()
          "$javaHash  riffty-java-${{ matrix.target }}.zip" | Out-File -Encoding ascii "dist/riffty-java-${{ matrix.target }}.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*

  verify-bundle-linux:
    name: Clean-Room Verify (Linux Debian 12 — Zero Runtimes)
    needs: build-binaries
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm-slim
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-x86_64-unknown-linux-gnu
          path: /tmp/dist
      - name: Verify SHA-256, lean core, and on-demand Java hydration in bare Debian 12
        shell: bash
        run: |
          set -euo pipefail
          # Prove container has zero Python/Node/Java preinstalled
          for bin in java javac python3 node npm cargo; do
            if command -v "$bin" >/dev/null 2>&1; then
              echo "ERROR: unexpected runtime $bin in clean-room container" >&2
              exit 1
            fi
          done
          cd /tmp/dist
          sha256sum -c riffty-x86_64-unknown-linux-gnu.tar.gz.sha256
          sha256sum -c riffty-java-x86_64-unknown-linux-gnu.tar.gz.sha256

          mkdir -p /tmp/bin /tmp/cache/plugins/riffty-java
          tar -xzf riffty-x86_64-unknown-linux-gnu.tar.gz -C /tmp/bin
          export PATH="/tmp/bin:/usr/bin:/bin"
          export RIFFTY_CACHE_DIR="/tmp/cache"

          VER="$(riffty --version | awk '{print $2}')"
          riffty-ab --version
          riffty plugin status

          # Pre-hydrate from exact release sidecar tarball to simulate cached on-demand hydration
          mkdir -p "/tmp/cache/plugins/riffty-java/v${VER}"
          tar -xzf riffty-java-x86_64-unknown-linux-gnu.tar.gz -C "/tmp/cache/plugins/riffty-java/v${VER}"

          mkdir -p /tmp/demo && cd /tmp/demo
          printf 'async def f(): pass\ndef g(): f()\n' > app.py
          printf 'export const x = [3, 1, 2].sort();\n' > app.ts
          printf '{"compilerOptions":{"strict":true}}\n' > tsconfig.json
          printf 'import java.math.BigDecimal;\nclass App { BigDecimal x = new BigDecimal(0.1); }\n' > App.java

          riffty plugin status
          rc=0
          riffty check --offline --require-tier2 --fix --dry-run --summary . || rc=$?
          if [ "$rc" -ge 2 ]; then
            echo "ERROR: clean-room Linux check failed with fatal exit $rc" >&2
            exit "$rc"
          fi

  verify-bundle-macos:
    name: Clean-Room Verify (macOS arm64 — Stripped env -i)
    needs: build-binaries
    runs-on: macos-14
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-aarch64-apple-darwin
          path: /tmp/dist
      - name: Verify SHA-256 and zero-JAVA_HOME execution on macOS arm64
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/dist
          shasum -a 256 -c riffty-aarch64-apple-darwin.tar.gz.sha256
          shasum -a 256 -c riffty-java-aarch64-apple-darwin.tar.gz.sha256

          CLEAN_HOME="$(mktemp -d)"
          mkdir -p "$CLEAN_HOME/bin" "$CLEAN_HOME/demo"
          tar -xzf riffty-aarch64-apple-darwin.tar.gz -C "$CLEAN_HOME/bin"
          VER="$("$CLEAN_HOME/bin/riffty" --version | awk '{print $2}')"
          mkdir -p "$CLEAN_HOME/cache/plugins/riffty-java/v${VER}"
          tar -xzf riffty-java-aarch64-apple-darwin.tar.gz -C "$CLEAN_HOME/cache/plugins/riffty-java/v${VER}"

          printf 'async def f(): pass\ndef g(): f()\n' > "$CLEAN_HOME/demo/app.py"
          printf 'export const x = [3, 1, 2].sort();\n' > "$CLEAN_HOME/demo/app.ts"
          printf '{"compilerOptions":{"strict":true}}\n' > "$CLEAN_HOME/demo/tsconfig.json"
          printf 'import java.math.BigDecimal;\nclass App { BigDecimal x = new BigDecimal(0.1); }\n' > "$CLEAN_HOME/demo/App.java"

          env -i HOME="$CLEAN_HOME" RIFFTY_CACHE_DIR="$CLEAN_HOME/cache" PATH="$CLEAN_HOME/bin:/usr/bin:/bin" bash -euo pipefail -c '
            riffty --version
            riffty-ab --version
            riffty plugin status
            cd "$HOME/demo"
            rc=0
            riffty check --offline --require-tier2 --fix --dry-run --summary . || rc=$?
            if [ "$rc" -ge 2 ]; then exit "$rc"; fi
          '

  publish-release:
    name: Publish Attested GitHub Release + SBOM
    needs: [build-binaries, verify-bundle-linux, verify-bundle-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Prepare verified installers
        run: |
          cp scripts/install.sh artifacts/riffty-installer.sh
          cp scripts/install.ps1 artifacts/riffty-installer.ps1
          chmod +x artifacts/riffty-installer.sh
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: artifacts/riffty-sbom.cdx.json
          upload-artifact: false
      - name: Attest SLSA Build Provenance for all release archives
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            artifacts/riffty-*.tar.gz
            artifacts/riffty-*.zip
            artifacts/riffty-sbom.cdx.json
      - name: Extract curated release notes from CHANGELOG.md
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VER="${TAG#v}"
          awk -v ver="$VER" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "Release ${TAG}" > release_notes.md
          fi
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: artifacts/*
          body_path: release_notes.md
          generate_release_notes: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') }}

  publish-docker:
    name: Publish Pre-Hydrated Docker Image to GHCR
    needs: [verify-bundle-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ghcr.io/riffty-sh/riffty
        run: |
          TAG="${GITHUB_REF_NAME}"
          docker build -t "ghcr.io/riffty-sh/riffty:${TAG}" -t "ghcr.io/riffty-sh/riffty:latest" .
          docker push "ghcr.io/riffty-sh/riffty:${TAG}"
          docker push "ghcr.io/riffty-sh/riffty:latest"
