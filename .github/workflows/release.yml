name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build & publish (e.g. v0.4.0)"
        required: false
        type: string
  workflow_call:
    inputs:
      tag:
        description: "Release tag created by release-please"
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-java-sidecar-jar:
    name: Build Java Tier 2 Sidecar JAR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Build & test shaded riffty-java-runner.jar and SHA-256 manifest
        run: bash plugins/riffty-java/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: java-sidecar-jar
          path: |
            plugins/riffty-java/dist/riffty-java-runner.jar
            plugins/riffty-java/dist/riffty-java.sha256

  build-binaries:
    name: Build Core + On-Demand Java Sidecar (${{ matrix.target }})
    needs: build-java-sidecar-jar
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            ext: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            ext: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            ext: tar.gz
          - target: x86_64-apple-darwin
            os: macos-15-intel
            ext: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: zip
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/download-artifact@v4
        with:
          name: java-sidecar-jar
          path: plugins/riffty-java/dist
      - name: Package self-contained jlink JDK 25 runtime + Leyden AOT cache
        shell: bash
        env:
          SKIP_JAR_BUILD: "1"
        run: bash plugins/riffty-java/package_jlink_aot.sh
      - name: Build lean core release binaries
        run: cargo build --release --target ${{ matrix.target }} --bin riffty --bin riffty_mcp --bin riffty-ab
      - name: Package Unix lean core + on-demand Java sidecar archives
        if: matrix.ext == 'tar.gz'
        shell: bash
        run: |
          mkdir -p dist core-staging java-staging
          cp "target/${{ matrix.target }}/release/riffty" core-staging/
          cp "target/${{ matrix.target }}/release/riffty_mcp" core-staging/
          cp "target/${{ matrix.target }}/release/riffty-ab" core-staging/
          cp LICENSE README.md core-staging/
          tar -C core-staging -czf "dist/riffty-${{ matrix.target }}.tar.gz" .

          cp -R plugins/riffty-java/dist/. java-staging/
          tar -C java-staging -czf "dist/riffty-java-${{ matrix.target }}.tar.gz" .

          hash_file() {
            if command -v sha256sum >/dev/null 2>&1; then
              (cd dist && sha256sum "$1" > "$1.sha256")
            else
              (cd dist && shasum -a 256 "$1" > "$1.sha256")
            fi
          }
          hash_file "riffty-${{ matrix.target }}.tar.gz"
          hash_file "riffty-java-${{ matrix.target }}.tar.gz"
      - name: Package Windows lean core + on-demand Java sidecar archives
        if: matrix.ext == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist, core-staging, java-staging | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/riffty.exe" core-staging/
          Copy-Item "target/${{ matrix.target }}/release/riffty_mcp.exe" core-staging/
          Copy-Item "target/${{ matrix.target }}/release/riffty-ab.exe" core-staging/
          Copy-Item LICENSE, README.md core-staging/
          Compress-Archive -Path core-staging/* -DestinationPath "dist/riffty-${{ matrix.target }}.zip"
          $coreHash = (Get-FileHash "dist/riffty-${{ matrix.target }}.zip" -Algorithm SHA256).Hash.ToLower()
          "$coreHash  riffty-${{ matrix.target }}.zip" | Out-File -Encoding ascii "dist/riffty-${{ matrix.target }}.zip.sha256"

          Copy-Item -Recurse -Force "plugins/riffty-java/dist/*" java-staging/
          Compress-Archive -Path java-staging/* -DestinationPath "dist/riffty-java-${{ matrix.target }}.zip"
          $javaHash = (Get-FileHash "dist/riffty-java-${{ matrix.target }}.zip" -Algorithm SHA256).Hash.ToLower()
          "$javaHash  riffty-java-${{ matrix.target }}.zip" | Out-File -Encoding ascii "dist/riffty-java-${{ matrix.target }}.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*

  verify-bundle-linux:
    name: Clean-Room Verify (Linux Debian 12 — Zero Runtimes)
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: dist-x86_64-unknown-linux-gnu
          path: /tmp/dist
      - name: Verify installer, SHA-256, and live on-demand Java hydration in bare Debian 12
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/install.sh /tmp/dist/riffty-installer.sh
          python3 -m http.server 18080 --bind 127.0.0.1 --directory /tmp/dist >/tmp/http.log 2>&1 &
          HTTP_PID=$!
          trap 'kill "$HTTP_PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:18080/riffty-installer.sh >/dev/null; then
              break
            fi
            sleep 0.2
          done

          docker run --rm --network=host debian:bookworm-slim bash -euo pipefail -c '
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends curl ca-certificates >/dev/null
            rm -rf /var/lib/apt/lists/*

            # Prove container has zero Python/Node/Java/Cargo preinstalled
            for bin in java javac python3 node npm cargo; do
              if command -v "$bin" >/dev/null 2>&1; then
                echo "ERROR: unexpected runtime $bin in clean-room container" >&2
                exit 1
              fi
            done

            export HOME="/tmp/clean-home"
            mkdir -p "$HOME" /tmp/demo

            # Run actual install.sh via curl | sh against local ephemeral HTTP server
            curl -LsSf http://127.0.0.1:18080/riffty-installer.sh | RIFFTY_BASE_URL=http://127.0.0.1:18080 sh
            grep -Fq "$HOME/.local/bin" "$HOME/.bashrc" || grep -Fq "$HOME/.local/bin" "$HOME/.profile"

            export PATH="$HOME/.local/bin:/usr/bin:/bin"
            riffty --version
            riffty-ab --version
            riffty plugin status

            cd /tmp/demo
            printf "async def f(): pass\ndef g(): f()\n" > app.py
            printf "export const x = [3, 1, 2].sort();\n" > app.ts
            printf "{\"compilerOptions\":{\"strict\":true}}\n" > tsconfig.json
            printf "import java.math.BigDecimal;\nclass App { BigDecimal x = new BigDecimal(0.1); }\n" > App.java

            # Prove live on-demand SHA-256-verified riffty-java hydration + Tier 2 execution
            rc=0
            RIFFTY_PLUGIN_BASE_URL=http://127.0.0.1:18080 riffty check --require-tier2 --fix --dry-run --summary . || rc=$?
            if [ "$rc" -ge 2 ]; then
              echo "ERROR: clean-room Linux check failed with fatal exit $rc" >&2
              exit "$rc"
            fi
            riffty plugin status | grep -q "READY (SHA-256 OK)"
          '

  verify-bundle-macos:
    name: Clean-Room Verify (macOS arm64 — Stripped env -i)
    needs: build-binaries
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: dist-aarch64-apple-darwin
          path: /tmp/dist
      - name: Verify installer, SHA-256, and live on-demand Java hydration on macOS arm64
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/install.sh /tmp/dist/riffty-installer.sh
          python3 -m http.server 18080 --bind 127.0.0.1 --directory /tmp/dist >/tmp/http.log 2>&1 &
          HTTP_PID=$!
          trap 'kill "$HTTP_PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:18080/riffty-installer.sh >/dev/null; then
              break
            fi
            sleep 0.2
          done

          CLEAN_HOME="$(mktemp -d)"
          mkdir -p "$CLEAN_HOME/demo"
          printf 'async def f(): pass\ndef g(): f()\n' > "$CLEAN_HOME/demo/app.py"
          printf 'export const x = [3, 1, 2].sort();\n' > "$CLEAN_HOME/demo/app.ts"
          printf '{"compilerOptions":{"strict":true}}\n' > "$CLEAN_HOME/demo/tsconfig.json"
          printf 'import java.math.BigDecimal;\nclass App { BigDecimal x = new BigDecimal(0.1); }\n' > "$CLEAN_HOME/demo/App.java"

          env -i HOME="$CLEAN_HOME" SHELL="/bin/zsh" PATH="/usr/bin:/bin" bash -euo pipefail -c '
            curl -LsSf http://127.0.0.1:18080/riffty-installer.sh | RIFFTY_BASE_URL=http://127.0.0.1:18080 sh
            grep -Fq "$HOME/.local/bin" "$HOME/.zshrc"

            export PATH="$HOME/.local/bin:/usr/bin:/bin"
            riffty --version
            riffty-ab --version
            riffty plugin status

            cd "$HOME/demo"
            rc=0
            RIFFTY_PLUGIN_BASE_URL=http://127.0.0.1:18080 riffty check --require-tier2 --fix --dry-run --summary . || rc=$?
            if [ "$rc" -ge 2 ]; then
              echo "ERROR: clean-room macOS check failed with fatal exit $rc" >&2
              exit "$rc"
            fi
            riffty plugin status | grep -q "READY (SHA-256 OK)"
          '

  verify-bundle-windows:
    name: Clean-Room Verify (Windows x64 — Stripped PATH)
    needs: build-binaries
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: dist-x86_64-pc-windows-msvc
          path: ${{ runner.temp }}\dist
      - name: Verify installer, SHA-256, and live on-demand Java hydration on Windows x64
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $distDir = Join-Path $env:RUNNER_TEMP "dist"
          Copy-Item "scripts\install.ps1" (Join-Path $distDir "riffty-installer.ps1") -Force

          $server = Start-Process -FilePath "python" -ArgumentList "-m", "http.server", "18080", "--bind", "127.0.0.1", "--directory", $distDir -PassThru -NoNewWindow
          try {
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              try {
                Invoke-WebRequest -Uri "http://127.0.0.1:18080/riffty-installer.ps1" -UseBasicParsing | Out-Null
                $ready = $true
                break
              } catch {
                Start-Sleep -Milliseconds 200
              }
            }
            if (-not $ready) { throw "Local HTTP server did not become ready" }

            $cleanRoot = Join-Path $env:RUNNER_TEMP ("clean-" + [System.Guid]::NewGuid().ToString())
            $installDir = Join-Path $cleanRoot "bin"
            $cacheDir = Join-Path $cleanRoot "cache"
            $demoDir = Join-Path $cleanRoot "demo"
            New-Item -ItemType Directory -Force -Path $demoDir | Out-Null

            Set-Content -Path (Join-Path $demoDir "app.py") -Value "async def f(): pass`ndef g(): f()`n" -NoNewline
            Set-Content -Path (Join-Path $demoDir "app.ts") -Value "export const x = [3, 1, 2].sort();`n" -NoNewline
            Set-Content -Path (Join-Path $demoDir "tsconfig.json") -Value '{"compilerOptions":{"strict":true}}' -NoNewline
            Set-Content -Path (Join-Path $demoDir "App.java") -Value "import java.math.BigDecimal;`nclass App { BigDecimal x = new BigDecimal(0.1); }`n" -NoNewline

            # Strip system Python/Node/Java/Cargo from PATH and clear JAVA_HOME
            $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot;$env:SystemRoot\System32\WindowsPowerShell\v1.0"
            Remove-Item Env:JAVA_HOME -ErrorAction SilentlyContinue
            foreach ($bin in @("java", "javac", "python", "python3", "node", "npm", "cargo")) {
              if (Get-Command $bin -ErrorAction SilentlyContinue) {
                throw "Unexpected runtime $bin found on stripped Windows PATH"
              }
            }

            $env:RIFFTY_BASE_URL = "http://127.0.0.1:18080"
            $env:RIFFTY_INSTALL_DIR = $installDir
            $env:RIFFTY_CACHE_DIR = $cacheDir
            $env:RIFFTY_PLUGIN_BASE_URL = "http://127.0.0.1:18080"

            Invoke-RestMethod -Uri "http://127.0.0.1:18080/riffty-installer.ps1" | Invoke-Expression

            $userPath = [Environment]::GetEnvironmentVariable("Path", "User")
            if (-not ($userPath -split ";" -contains $installDir)) {
              throw "install.ps1 did not persist $installDir to User Path"
            }

            riffty --version
            riffty-ab --version
            riffty plugin status

            Push-Location $demoDir
            try {
              & riffty check --require-tier2 --fix --dry-run --summary .
              $rc = $LASTEXITCODE
              if ($rc -ge 2) {
                throw "Clean-room Windows check failed with fatal exit $rc"
              }
            } finally {
              Pop-Location
            }

            $statusOut = (& riffty plugin status | Out-String)
            Write-Host $statusOut
            if ($statusOut -notmatch "READY \(SHA-256 OK\)") {
              throw "Expected riffty-java Tier 2 to be READY (SHA-256 OK) after on-demand hydration"
            }
          } finally {
            if ($server -and -not $server.HasExited) {
              Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
            }
          }

  publish-release:
    name: Publish Attested GitHub Release + SBOM
    needs: [build-binaries, verify-bundle-linux, verify-bundle-macos, verify-bundle-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Prepare verified installers
        run: |
          cp scripts/install.sh artifacts/riffty-installer.sh
          cp scripts/install.ps1 artifacts/riffty-installer.ps1
          chmod +x artifacts/riffty-installer.sh
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: artifacts/riffty-sbom.cdx.json
          upload-artifact: false
      - name: Attest SLSA Build Provenance for all release archives
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            artifacts/riffty-*.tar.gz
            artifacts/riffty-*.zip
            artifacts/riffty-sbom.cdx.json
      - name: Extract curated release notes from CHANGELOG.md
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          VER="${TAG#v}"
          awk -v ver="$VER" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "Release ${TAG}" > release_notes.md
          fi
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: artifacts/*
          body_path: release_notes.md
          generate_release_notes: false
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-rc') || contains(inputs.tag || github.ref_name, '-alpha') || contains(inputs.tag || github.ref_name, '-beta') }}

  publish-docker:
    name: Publish Pre-Hydrated Docker Image to GHCR
    needs: [verify-bundle-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ghcr.io/riffty-sh/riffty
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          docker build -t "ghcr.io/riffty-sh/riffty:${TAG}" -t "ghcr.io/riffty-sh/riffty:latest" .
          docker push "ghcr.io/riffty-sh/riffty:${TAG}"
          docker push "ghcr.io/riffty-sh/riffty:latest"
